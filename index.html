<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemeHub - Ultimate Meme Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --gold: #ffd700;
  --gold-deep: #b8860b;
  --black: #080808;
  --surface: #111111;
  --surface2: #1a1a1a;
  --border: #2a2a2a;
  --border-gold: #3d3000;
  --text: #e8e0d0;
  --text-muted: #6b6355;
  --aqua: #00f2fe;
}
body{
  font-family:'Inter',sans-serif;
  background:var(--black);
  color:var(--text);
  min-height:100vh;
}
header{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px;
  height:70px;
  background:rgba(8,8,8,.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-gold);
}
.logo{
  font-family:'Space Grotesk',sans-serif;
  font-size:1.4rem;
  font-weight:800;
  color:var(--gold);
  text-decoration:none;
}
.admin-link{
  padding:8px 16px;
  background:var(--surface2);
  border:1px solid var(--border-gold);
  color:var(--gold);
  border-radius:10px;
  text-decoration:none;
  font-weight:700;
  font-size:0.85rem;
}
.admin-link:hover{ background:var(--gold-deep); color:#000; }
.container{ width:min(1200px,95%); margin:40px auto; }
.section-title{
  font-family:'Space Grotesk',sans-serif;
  font-size:1.5rem;
  color:var(--gold);
  margin:40px 0 20px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--border-gold);
  padding-bottom:10px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:20px;
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  transition:transform .2s;
}
.card:hover{ transform:translateY(-4px); border-color:var(--gold); }
.card-preview{ width:100%; height:200px; object-fit:cover; background:#000; display:block; }
.audio-card-box{
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#1a0a2e,#0d0820);
}
.card-body{
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.card-title{
  font-size:0.9rem;
  font-weight:700;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:140px;
}
.download-btn{
  background:linear-gradient(135deg,var(--gold-deep),var(--gold));
  color:#000;
  border:none;
  padding:8px 14px;
  border-radius:8px;
  font-weight:800;
  font-size:0.8rem;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.download-btn:hover{ opacity:0.9; }
.empty{ grid-column:1/-1; padding:40px; text-align:center; color:var(--text-muted); background:var(--surface); border-radius:12px; }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">🔥 MemeHub</a>
  <a href="Dashboard.html" class="admin-link">⚙️ Admin Vault</a>
</header>

<div class="container">
  <div class="section-title">🖼️ Meme Gallery</div>
  <div class="grid" id="main-images"></div>

  <div class="section-title">🎵 Audio Clips</div>
  <div class="grid" id="main-audio"></div>

  <div class="section-title">🎬 Videos</div>
  <div class="grid" id="main-video"></div>
</div>

<script>
const STORAGE_KEY = 'memehub_files_v1';

function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function loadVaultData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return { images:[], audio:[], video:[] };
  try { return JSON.parse(raw); } catch(e){ return { images:[], audio:[], video:[] }; }
}

// PROGRAMMATIC FORCE DOWNLOAD WITH ASSIGNED FILENAME
function downloadMeme(id, cat){
  const vault = loadVaultData();
  const file = (vault[cat] || []).find(x => x.id === id);
  if(!file) return;

  try {
    const parts = file.data.split(',');
    const mimeMatch = parts[0].match(/:(.*?);/);
    const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
    const bstr = atob(parts[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while(n--){
      u8arr[n] = bstr.charCodeAt(n);
    }
    const blob = new Blob([u8arr], {type: mime});
    const blobUrl = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = file.name; // STRICT CUSTOM ASSIGNED NAME
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
  } catch(e) {
    const a = document.createElement('a');
    a.href = file.data;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
}

function renderMainSite(){
  const data = loadVaultData();

  renderGrid('main-images', data.images, 'images', item => `
    <div class="card">
      <img class="card-preview" src="${item.data}" alt="${esc(item.name)}">
      <div class="card-body">
        <span class="card-title" title="${esc(item.name)}">${esc(item.name)}</span>
        <button class="download-btn" onclick="downloadMeme('${item.id}', 'images')">Download</button>
      </div>
    </div>
  `);

  renderGrid('main-audio', data.audio, 'audio', item => `
    <div class="card">
      <div class="audio-card-box">🎵</div>
      <div style="padding:10px 14px 0;"><audio controls style="width:100%;height:32px;" src="${item.data}"></audio></div>
      <div class="card-body">
        <span class="card-title" title="${esc(item.name)}">${esc(item.name)}</span>
        <button class="download-btn" onclick="downloadMeme('${item.id}', 'audio')">Download</button>
      </div>
    </div>
  `);

  renderGrid('main-video', data.video, 'video', item => `
    <div class="card">
      <video class="card-preview" controls src="${item.data}"></video>
      <div class="card-body">
        <span class="card-title" title="${esc(item.name)}">${esc(item.name)}</span>
        <button class="download-btn" onclick="downloadMeme('${item.id}', 'video')">Download</button>
      </div>
    </div>
  `);
}

function renderGrid(elemId, items, cat, cardTemplate){
  const container = document.getElementById(elemId);
  if(!container) return;
  if(!items || !items.length){
    container.innerHTML = `<div class="empty">No ${cat} added yet! Upload some in the Admin Vault.</div>`;
    return;
  }
  container.innerHTML = items.map(cardTemplate).join('');
}

window.addEventListener('DOMContentLoaded', renderMainSite);
</script>
</body>
</html>
